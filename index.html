const Card = ({ children, className = "", style = {} }) => (

const Pill = ({ children, tone = "neutral" }) => {

    pass: "bg-[#E5F5EA] text-[#146530]",
    fail: "bg-[#FCE7E9] text-[#B71F2E]",
    review: "bg-[#FBEFD8] text-[#8A6412]",
    gold: "bg-[#F7EAD0] text-[#8A6412]",
  };
  return <span className={`px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap ${tones[tone]}`}>{children}</span>;
};

const StageChip = ({ stage, stages }) => {
  const idx = stages.indexOf(stage);

  return <Pill tone={tone}>{stage}</Pill>;
};

};

const MelonRing = ({ progress, size = 96, label, value, stroke = 10 }) => {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const dash = (progress / 100) * c;
  const seedCount = 6;
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EEF2EA" strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.red} strokeWidth={stroke}
          strokeDasharray={`${dash} ${c - dash}`} strokeLinecap="round" />
        <circle cx={size / 2} cy={size / 2} r={r + stroke / 2 + 1.5} fill="none" stroke={C.green} strokeWidth={1.5} />
      </svg>
      {Array.from({ length: seedCount }).map((_, i) => {
        const angle = (i / seedCount) * 2 * Math.PI - Math.PI / 2;
        const x = size / 2 + r * Math.cos(angle);
        const y = size / 2 + r * Math.sin(angle);
        const lit = (i / seedCount) * 100 <= progress;
        return (
          <div key={i} className="absolute rounded-full" style={{
            width: 5, height: 7, left: x - 2.5, top: y - 3.5,
            background: lit ? C.ink : "#E3E8DE", transform: `rotate(${(angle * 180) / Math.PI + 90}deg)`
          }} />
        );
      })}
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="font-bold" style={{ color: C.ink, fontSize: size * 0.24 }}>{value}</div>
        {label && <div className="text-[9px] uppercase tracking-wide text-[#8B9187]">{label}</div>}
      </div>
    </div>
  );
};

          <Card key={c.id} className="p-4">
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{ background: "#EFF5F0" }}>
                <Icon name="fa-microphone" size={15} style={{ color: C.green }} />
              </div>
              <div className="w-44 shrink-0">
                <div className="text-[13px] font-semibold" style={{ color: C.ink }}>{c.agent}</div>
                <div className="text-[11px] text-[#8B9187]">{c.lead} · {c.duration}</div>
              </div>
              <div className="w-28 shrink-0"><span className="text-[10.5px] font-mono text-[#8B9187]">Deal {c.linkedSubmission}</span></div>
              <div className="flex-1 flex items-center gap-4">
                {c.checks.map(([label, met]) => (
                  <div key={label} className="flex items-center gap-1.5 text-[11px] text-[#4E5750]">
                    <Icon name={met ? "fa-circle-check" : "fa-circle-xmark"} size={13} style={{ color: met ? C.green : C.redDark }} />
                    {label}
                  </div>
                ))}
              </div>
              <Pill tone={c.result === "Pass" ? "pass" : c.result === "Fail" ? "fail" : "review"}>{c.result}</Pill>
              {c.result !== "Pass" && <Btn icon="fa-clipboard-check">Override</Btn>}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ============================== ADMIN: SUBMISSIONS ============================== */

  return (
    <div>
      <PageHeader eyebrow="From submission to onboarding" title="Submissions tracking" />
      <div className="space-y-4">
        {SUBMISSIONS.map((o) => <SubmissionRow key={o.id} o={o} />)}

    </div>

}

                  <Icon name={i.icon} size={14} style={{ color: C.green }} />

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
